    damageBase(amount){
      if(!this.baseAlive)return;if(this.baseShield>0){this.burst(312,600,'shield');return;}
      this.baseHP=Math.max(0,this.baseHP-amount*this.mods.coreDR);this.baseShield=.4;this.burst(312,600,'hit');this.shake=3;
      if(this.baseHP<=0){this.baseAlive=false;this.baseNode.setAttribute('href','#base-ruin');this.burst(312,600,'boss');this.finish(false,'核心耐久耗尽，基地已被摧毁。');}
      else{this.toast('核心受到攻击 · 耐久 '+Math.ceil(this.baseHP),1.7);this.log('核心告警 · 耐久 '+Math.ceil(this.baseHP));this.sound.play('warning');}
      this.updateHUD();
    }
    detonateProp(prop){
      if(!prop.alive)return;prop.alive=false;prop.node.remove();this.burst(prop.x,prop.y,'barrel');this.sound.play('explosion');this.shake=Math.max(this.shake,3);
      // 先标记油桶已销毁，再触发连锁，防止递归回到同一个油桶。
      for(const p of this.props)if(p.alive&&distance(prop,p)<81)this.detonateProp(p);
      for(const t of [this.player,...this.enemies])if(t?.alive&&distance(prop,t)<80)this.damageTank(t,t.team==='player'?40:76);
      for(const row of this.tiles)for(const tile of row)if(tile?.type==='#'&&Math.hypot(tile.x+12-prop.x,tile.y+12-prop.y)<71)this.removeBrick(tile);
      if(distance(prop,{x:312,y:600})<76)this.damageBase(26);
    }
    updateCombat(dt){
      if(this.player?.alive&&this.input.fire)this.fire(this.player);
      this.updateSpawns(dt);for(const e of [...this.enemies])if(e.alive)this.updateEnemy(e,dt);this.updateBullets(dt);
      if(this.state!=='playing')return;
      if(!this.player.alive&&this.lives>0){this.respawnTime-=dt;if(this.respawnTime<=0){const spot=[{x:216,y:600},{x:408,y:600},{x:168,y:600},{x:456,y:600}].find(p=>this.canOccupy(null,p.x,p.y));if(spot){this.player=this.createTank('player',spot.x,spot.y,0);this.player.shield=3;this.burst(spot.x,spot.y,'spawn');this.sound.play('spawn');this.toast('增援就绪 · 3 秒重生护盾',2);this.empCD=Math.max(0,this.empCD-4);}else this.respawnTime=.15;}}
      if(this.killed>=this.config.total&&this.spawned>=this.config.total&&!this.enemies.length&&!this.spawns.length)this.clearStage();
    }

    // ━━ 6. 主动技能、拾取物、维修区与中继站 ━━━━━━━━━━━━━━━━━━━━━━━━━
    dash(){
      const p=this.player;if(this.state!=='playing'||!p?.alive||this.dashCD>0)return false;
      p.dashDir=this.input.direction??p.dir;p.dashTime=.23;p.shield=Math.max(p.shield,.28);this.dashCD=CHASSIS[this.chassis].dashCD*this.mods.cooling*this.mods.dash;
      this.burst(p.x,p.y,'dash');this.sound.play('dash');this.updateHUD();return true;
    }
    emp(){
      const p=this.player;if(this.state!=='playing'||!p?.alive||this.empCD>0)return false;
      const c=CHASSIS[this.chassis],radius=174;this.empCD=c.empCD*this.mods.cooling*(this.uplink?.captured?.78:1);
      for(const b of this.bullets)if(b.team==='enemy'&&distance(p,b)<radius)this.removeBullet(b);
      for(const e of [...this.enemies])if(distance(p,e)<radius){e.stun=e.kind==='boss'?1.1:2.7;this.damageTank(e,c.empPower*this.mods.damage);}
      for(const h of this.hazards)if(distance(p,h)<radius){h.done=true;h.node.remove();}
      this.ring(p.x,p.y,radius,'#b9a2ff',.62);this.burst(p.x,p.y,'emp');this.sound.play('emp');this.shake=Math.max(this.shake,1.3);this.floatingText(p.x,p.y-32,'EMP','#c3b6ff');this.updateHUD();return true;
    }
    spawnDrop(x,y,kind){
      const colors={armor:'#79ffd0',energy:'#b6a0ff',overdrive:'#ffcf87',shield:'#81ddff',core:'#ffb4cb'},icons={armor:'icon-cross',energy:'icon-emp',overdrive:'icon-weapon',shield:'icon-shield',core:'icon-home'};
      const color=colors[kind],node=svg('g',{transform:`translate(${x} ${y})`},this.layers.drop);
      svg('circle',{r:19,fill:color,'fill-opacity':'.06',stroke:color,'stroke-opacity':'.35','stroke-width':.7},node);svg('path',{d:'M-12-9-9-12H9l3 3V9l-3 3H-9l-3-3z',fill:'#142a35',stroke:color,'stroke-width':1.2},node);use(icons[kind],-8,-8,16,16,node).style.color=color;
      this.drops.push({x,y,kind,color,node,life:20,age:0});while(this.drops.length>10)this.drops.shift().node.remove();
    }
    collectDrop(d){
      const p=this.player;let label='';
      if(d.kind==='armor'){p.hp=Math.min(p.maxHp,p.hp+38);label='装甲 +38';}
      if(d.kind==='energy'){this.empCD=Math.max(0,this.empCD-6);this.dashCD=Math.max(0,this.dashCD-2.5);label='技能充能';}
      if(d.kind==='overdrive'){this.overdrive=10;label='火力过载 10s';}
      if(d.kind==='shield'){p.shield=Math.max(p.shield,4);label='护盾 4s';}
      if(d.kind==='core'){this.baseHP=Math.min(this.baseMax,this.baseHP+22);label='核心维修 +22';}
      this.floatingText(p.x,p.y-32,label,d.color);this.burst(p.x,p.y,'pickup');this.sound.play('pickup');this.log(label);d.life=0;d.node.remove();this.updateHUD();
    }
    addHazard(x,y,radius,time,damage){
      if(this.hazards.filter(h=>!h.done).length>=9)return;
      x=clamp(x,radius,SIZE-radius);y=clamp(y,radius,SIZE-radius);
      const node=svg('g',{transform:`translate(${x} ${y})`},this.layers.hazard);
      svg('circle',{r:radius,fill:'#f95575','fill-opacity':'.10',stroke:'#ff8494','stroke-width':1,'stroke-dasharray':'4 3',class:'hazard-ring'},node);
      const fill=svg('circle',{r:radius*.15,fill:'#ff6680','fill-opacity':'.18',stroke:'#ff8091','stroke-width':.6},node);
      svg('path',{d:'M-8 0H8M0-8V8',stroke:'#ffc2be','stroke-width':1.4},node);
      this.hazards.push({x,y,radius,time,total:time,damage,node,fill,done:false});
    }
    updateSystems(dt){
      this.overdrive=Math.max(0,(this.overdrive||0)-dt);const p=this.player;
      for(const d of this.drops){d.age+=dt;d.life-=dt;if(d.life<=0){d.node.remove();continue;}
        if(p?.alive){const dist=distance(p,d);if(dist<25)this.collectDrop(d);else if(dist<78){d.x+=(p.x-d.x)/dist*115*dt;d.y+=(p.y-d.y)/dist*115*dt;}}
      }this.drops=this.drops.filter(d=>d.life>0);
      for(const pad of this.repairPads){pad.cd=Math.max(0,pad.cd-dt);if(p?.alive&&pad.cd===0&&p.hp<p.maxHp&&distance(p,pad)<21){p.hp=Math.min(p.maxHp,p.hp+28);pad.cd=24;this.floatingText(p.x,p.y-29,'维修 +28','#8effd5');this.sound.play('pickup');this.log('现场维修区已使用');}pad.node.setAttribute('opacity',pad.cd>0?'.3':'1');}
      if(this.uplink&&!this.uplink.captured){const u=this.uplink;if(p?.alive&&distance(p,u)<31){u.progress+=dt;u.ring.setAttribute('stroke-dasharray',`${Math.min(1,u.progress/4)*176} 176`);if(u.progress>=4){u.captured=true;this.score+=350;this.empCD=0;p.hp=p.maxHp;this.lives=Math.min(3,this.lives+1);this.baseHP=Math.min(this.baseMax,this.baseHP+30);this.toast('中继已接管 · 脉冲冷却 -22% · 增援 +1',3);this.log('中继站接管完成 +350');this.ring(u.x,u.y,90,'#a390ff',.7);this.sound.play('clear');this.saveBest();}}
        else{u.progress=Math.max(0,u.progress-dt*.35);u.ring.setAttribute('stroke-dasharray',`${u.progress/4*176} 176`);}
      }
      for(const h of this.hazards){if(h.done)continue;h.time-=dt;if(h.time<=0){h.done=true;h.node.remove();this.burst(h.x,h.y,'barrel');this.ring(h.x,h.y,h.radius,'#ffa397',.35);this.shake=Math.max(this.shake,2);this.sound.play('explosion');if(p?.alive&&distance(p,h)<h.radius+10)this.damageTank(p,h.damage);if(distance({x:312,y:600},h)<h.radius+17)this.damageBase(h.damage);for(const row of this.tiles)for(const t of row)if(t?.type==='#'&&Math.hypot(t.x+12-h.x,t.y+12-h.y)<h.radius)this.removeBrick(t);}}
      this.hazards=this.hazards.filter(h=>!h.done);
      // 壁垒战车靠近基地时每 2 秒恢复 2 点核心耐久。
      this.padClock+=dt;if(this.padClock>=2){this.padClock=0;if(this.chassis===2&&p?.alive&&distance(p,{x:312,y:600})<130)this.baseHP=Math.min(this.baseMax,this.baseHP+2);}
      if(p?.alive&&p.moving){p.trail-=dt;if(p.trail<=0){p.trail=p.dashTime>0?.025:.065;this.trail(p);}}
    }

    // ━━ 7. 现代动画：弹焰、轨迹、冲击波、火花、残骸（均有生命周期） ━━━━
    ring(x,y,radius,color,life=.5){
      const node=svg('circle',{r:radius,fill:color,'fill-opacity':'.045',stroke:color,'stroke-width':1.3},this.layers.effect);
      this.particles.push({x,y,vx:0,vy:0,life,total:life,node,kind:'ring',angle:0});
    }
    burst(x,y,kind='tank'){
      const options={
        tank:{n:19,s:160,t:.6,c:['#ffe2ae','#ffab81','#b76766']},boss:{n:42,s:270,t:1.05,c:['#fff3c3','#ffb586','#ff727e']},barrel:{n:25,s:225,t:.7,c:['#fff2ce','#ffc477','#ef8b6d']},
        wall:{n:7,s:95,t:.32,c:['#d4bb91','#b19368','#827563']},steel:{n:6,s:140,t:.26,c:['#d8f6ff','#8caac4','#fafbdc']},hit:{n:7,s:92,t:.25,c:['#fff2c8','#f5b18d','#fd8392']},
        shield:{n:6,s:85,t:.26,c:['#a0ffdf','#6be0cc','#dafdf1']},muzzle:{n:4,s:75,t:.13,c:['#fff7c5','#e3fff2','#99dfd1']},spawn:{n:8,s:70,t:.42,c:['#ffd0c2','#fcbfb9','#9ccae1']},
        emp:{n:18,s:220,t:.5,c:['#fff','#c0aaff','#89d8ff']},dash:{n:10,s:90,t:.3,c:['#e0fff4','#75f6c1','#63cbd5']},pickup:{n:10,s:75,t:.38,c:['#b5ffe4','#f4fff8','#7abfef']}
      };
      const o=options[kind]||options.tank,n=this.reducedMotion?Math.ceil(o.n*.4):o.n;
      for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=o.s*(.25+Math.random()*.75),life=o.t*(.6+Math.random()*.4),color=o.c[i%o.c.length];let node;
        if(i%3===0)node=svg('path',{d:'M0 0h'+(3+Math.random()*7),stroke:color,'stroke-width':1.3,'stroke-linecap':'round'},this.layers.effect);
        else node=svg('circle',{r:(kind==='muzzle'?1:1.4)+Math.random()*1.6,fill:color},this.layers.effect);
        this.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life,total:life,node,angle:a*180/Math.PI,kind:'spark'});
      }
      if(['tank','boss','barrel'].includes(kind)){this.ring(x,y,kind==='boss'?97:kind==='barrel'?78:49,'#ffc9a0',kind==='boss'?.8:.5);const node=svg('circle',{r:kind==='boss'?38:20,fill:'#fff1cf'},this.layers.effect);this.particles.push({x,y,vx:0,vy:0,life:.13,total:.13,node,kind:'flash',angle:0});}
      while(this.particles.length>250)this.particles.shift().node.remove();
    }
    trail(t){
      if(this.reducedMotion)return;const dash=t.dashTime>0,color=CHASSIS[this.chassis].color,d=DIR[t.dir];
      const node=svg('path',{d:'M-13 0v8M13 0v8',stroke:dash?color:'#a8dace','stroke-width':dash?3:1.1,'stroke-linecap':'round',opacity:'.3'},this.layers.decal);
      this.particles.push({x:t.x-d.x*15,y:t.y-d.y*15,vx:0,vy:0,life:dash?.3:.6,total:dash?.3:.6,node,kind:'trail',angle:t.dir*90});
    }
    addDecal(x,y){
      const node=svg('g',{transform:`translate(${x} ${y})`,opacity:'.35'},this.layers.decal);svg('ellipse',{rx:18,ry:13,fill:'#03090e'},node);svg('path',{d:'m-12 1 7-5 5 3 9-5 3 6-4 6-7-3-8 6z',fill:'#3b3d40'},node);
      this.decals.push({node,life:18});while(this.decals.length>20)this.decals.shift().node.remove();
    }
    floatingText(x,y,message,color='#c0ffdf',life=.85){
      const node=svg('text',{'text-anchor':'middle','font-size':message.length>9?10:12,'font-weight':700,fill:color,stroke:'#0a1822','stroke-width':3,'paint-order':'stroke'},this.layers.float);node.style.fill=color;node.textContent=message;
      this.floats.push({x,y,life,total:life,node});while(this.floats.length>15)this.floats.shift().node.remove();
    }
    updateEffects(dt){
      for(const p of this.particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.max(0,1-dt*2);p.vy*=Math.max(0,1-dt*2);if(p.life<=0)p.node.remove();}this.particles=this.particles.filter(p=>p.life>0);
      for(const f of this.floats){f.life-=dt;f.y-=24*dt;if(f.life<=0)f.node.remove();}this.floats=this.floats.filter(f=>f.life>0);
      for(const d of this.decals){d.life-=dt;if(d.life<=0)d.node.remove();}this.decals=this.decals.filter(d=>d.life>0);
    }
    renderEffects(){
      for(const p of this.particles){const age=clamp(1-p.life/p.total,0,1);p.node.setAttribute('transform',`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) ${p.kind==='ring'?`scale(${.07+.93*(1-(1-age)**2)})`:`rotate(${p.angle||0})`}`);p.node.setAttribute('opacity',Math.max(0,Math.min(1,p.life/p.total*(p.kind==='trail'?.42:1.55))).toFixed(2));}
      for(const f of this.floats){f.node.setAttribute('transform',`translate(${f.x.toFixed(1)} ${f.y.toFixed(1)})`);f.node.setAttribute('opacity',Math.min(1,f.life*3));}
      for(const s of this.spawns){s.node.setAttribute('transform',`translate(${s.x} ${s.y}) rotate(${(1-clamp(s.time/s.total,0,1))*90}) scale(${.6+.4*(1-clamp(s.time/s.total,0,1))})`);s.node.setAttribute('opacity',.4+.6*Math.abs(Math.sin(this.clock*10)));}
      for(const d of this.drops){d.node.setAttribute('transform',`translate(${d.x.toFixed(1)} ${(d.y+(this.reducedMotion?0:Math.sin(d.age*4)*2.5)).toFixed(1)})`);d.node.setAttribute('opacity',d.life<3&&Math.floor(d.life*5)%2?'.35':'1');}
      for(const h of this.hazards)h.fill.setAttribute('r',h.radius*(1-clamp(h.time/h.total,0,1)));
    }
    finish(won,reason=''){
      if(['lost','won'].includes(this.state))return;this.state=won?'won':'lost';this.endReason=reason;this.input.clear();this.saveBest();
      this.bullets.forEach(b=>this.removeBullet(b));this.bullets=[];this.hazards.forEach(h=>h.node.remove());this.hazards=[];this.setOverlay();this.updateHUD();this.sound.play(won?'win':'lose');this.announce((won?'战役胜利。':'任务失败。')+reason+' 得分 '+this.score+'。');
    }
    clearStage(){this.score+=500;this.saveBest();this.finish(true,'区域已肃清。');}
  }

  // ━━ 8. 状态流转：机库 → 战斗 → 三选一强化 → 下一区域 / 最终结算 ━━━━━
  class TankBattle extends CombatGame {
    clearStage(){
      if(this.state!=='playing')return;
      const bonus=500+Math.max(0,Math.floor((150-this.stageTime)*3));this.score+=bonus;this.saveBest();
      this.bullets.forEach(b=>this.removeBullet(b));this.bullets=[];this.hazards.forEach(h=>h.node.remove());this.hazards=[];this.spawns.forEach(s=>s.node.remove());this.spawns=[];
      if(this.mode==='campaign'&&this.level===LEVELS.length-1){this.finish(true,'三个区域已肃清，核心安全。');return;}
      this.state='upgrade';this.input.clear();this.lives=Math.min(3,this.lives+1);if(this.player?.alive)this.player.hp=this.player.maxHp;this.baseHP=this.baseMax;
      // 战斗暂停等玩家选择，不用倒计时催促。不同关卡提供不同战术分支。
      const indices=this.level%2===0?[0,1,2]:[3,4,5];this.offers=indices.map(i=>UPGRADES[i]);
      this.renderUpgradeCards();text('upgrade-sub',`区域奖励 +${bonus} 分 · 增援 +1（最多 3）· 选择一项永久强化`);
      text('upgrade-foot',this.mobile?'按 1 / 2 / 3 选择 · 强化持续本局':'按 1 / 2 / 3 选择 · 战车与核心已维修 · 所有强化持续本局');
      this.setOverlay();this.updateHUD();this.sound.play('clear');this.announce('区域已肃清。选择一项强化以进入下一关。');
    }
    renderUpgradeCards(){
      if(!this.offers)return;const layer=$('upgrade-cards');layer.replaceChildren();const m=this.mobile,w=m?620:348;
      this.offers.forEach((o,i)=>{
        const g=svg('g',{class:'button',role:'button',tabindex:0,'data-action':'choose-'+i,'aria-label':o.name+'，'+o.detail,transform:m?`translate(0 ${i*253})`:`translate(${i*372} 0)`},layer);
        svg('rect',{class:'button-bg',width:w,height:m?230:280,rx:14,fill:'#112936',stroke:i===0?'#4f997e':'#375369'},g);
        svg('rect',{x:24,y:24,width:50,height:50,rx:13,fill:['#254c40','#303b51','#383252'][i]},g);use(o.icon,35,35,28,28,g).style.color=['#83ffce','#b0d6ff','#c2aeff'][i];
        const n=svg('text',{x:w-29,y:41,'text-anchor':'end',class:'number','font-size':15,fill:'#6f95a5'},g);n.textContent='0'+(i+1);
        const kicker=svg('text',{x:m?96:24,y:m?40:108,class:'kicker'},g);kicker.textContent=o.tag;
        const name=svg('text',{x:m?96:24,y:m?73:147,'font-size':m?26:25,'font-weight':750},g);name.textContent=o.name;
        const detail=svg('text',{x:24,y:m?116:185,'font-size':15,fill:'#c6e2e8'},g);detail.textContent=o.detail;
        const note=svg('text',{x:24,y:m?150:214,'font-size':11.5,fill:'#91aeba'},g);note.textContent=o.note;
        svg('path',{d:`M24 ${m?173:235}H${w-24}`,stroke:'#294450'},g);
        const hint=svg('text',{x:24,y:m?204:263,'font-size':12,fill:'#90f9cb'},g);hint.textContent='安装模块  →';
        const key=svg('text',{x:w-26,y:m?204:263,'text-anchor':'end',class:'tiny'},g);key.textContent='PRESS '+(i+1);
      });
    }
    chooseUpgrade(index){
      if(this.state!=='upgrade'||!this.offers?.[index])return;const item=this.offers[index];
      switch(item.id){
        case 'damage':this.mods.damage*=1.25;break;
        case 'armor':this.mods.armor+=35;break;
        case 'cooling':this.mods.cooling=Math.max(.28,this.mods.cooling*.8);this.mods.fireRate=Math.min(2.2,this.mods.fireRate*1.12);break;
        case 'repair':this.mods.repair+=7;break;
        case 'core':this.mods.core+=35;this.mods.coreDR=Math.max(.35,this.mods.coreDR*.8);break;
        case 'mobility':this.mods.speed=Math.min(1.7,this.mods.speed*1.14);this.mods.dash=Math.max(.35,this.mods.dash*.8);break;
      }
      this.offers=null;this.state='playing';this.input.clear();this.input.aiming=false;this.loadLevel(this.level+1);this.setOverlay();this.updateHUD();this.focusGame();this.log(item.name+' · 模块已安装');this.sound.play('start');
    }
  }
  const game=new TankBattle();
  // 显式 ?test=1 时才开放测试入口；正常离线打开不暴露实体。
  if(new URLSearchParams(location.search).get('test')==='1')Object.defineProperty(window,'__tankTest',{value:{game,LEVELS,CHASSIS,ENEMY,WEAPONS,UPGRADES,STEP,DIR}});
})();

</script></body></html>
