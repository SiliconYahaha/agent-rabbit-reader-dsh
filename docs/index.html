    *{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:auto;padding:24px 24px 48px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}header strong{font-size:20px}a{color:#254b32;text-underline-offset:4px}header a{font-size:14px}.banner{display:block;width:100%;height:auto;border-radius:16px}section{text-align:center;padding:24px 0 0}h1{font-size:clamp(26px,5vw,36px);letter-spacing:-.03em;margin:0 0 12px}p{line-height:1.8;margin:0 auto 20px;max-width:640px;color:#526356}video{display:block;width:min(100%,360px);height:auto;aspect-ratio:9/16;max-height:78vh;margin:0 auto;background:#f8f5eb;border-radius:16px;box-shadow:0 10px 36px #23342612}nav{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:24px}.note{font-size:13px;margin-top:24px}footer{text-align:center;padding-top:24px;font-size:14px;color:#526356}@media(max-width:480px){main{padding:20px 16px 32px}header strong{font-size:18px}.banner{border-radius:10px}section{padding-top:24px}nav{gap:16px}}

<main>

    <h1 id="video-title">20 秒，看看文件里有什么</h1>
