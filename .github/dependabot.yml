version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      compatible-runtime-updates:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /tools/wechat-ci
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      compatible-upload-updates:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      action-updates:
        patterns: ['*']
